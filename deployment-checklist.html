      el.addEventListener("click", function () { viewHistorySession(history[+el.dataset.viewHist]); });
    });
    document.querySelectorAll("[data-export-hist]").forEach(function (el) {
      el.addEventListener("click", function () {
        var h = history[+el.dataset.exportHist];
        downloadJson(h.snapshot, "deployment-session-" + h.date + ".json");
      });
    });
    document.querySelectorAll("[data-print-hist]").forEach(function (el) {
      el.addEventListener("click", function () {
        var h = history[+el.dataset.printHist];
        buildPrintView(h.snapshot.config, h.snapshot.session);
        if (exportsToTracker() && !exportForTracker(h.snapshot.config, h.snapshot.session)) return;
        closeModal();
        window.print();
      });
    });
  }

  function viewHistorySession(record) {
    var root = document.getElementById("modal-root");
    var c = record.snapshot.config, s = record.snapshot.session;
    var prog = computeProgress(s);
    var html = '<div class="modal-overlay" id="modal-overlay"><div class="modal-box">' +
      '<h2>Read-Only Session — ' + esc(cen(s.date)) + '</h2>' +
      '<p style="font-size:13px;color:var(--muted)">Technician: ' + esc(cen(s.technician) || "—") + ' &middot; User: ' + esc(cen(s.user) || "—") + ' &middot; Device: ' + esc(cen(s.device) || "—") + '</p>' +
      '<p style="font-size:13px;color:var(--muted)">' + prog.phasesComplete + '/' + prog.totalPhases + ' phases complete, ' + prog.checkedSteps + '/' + prog.totalSteps + ' steps checked</p>';
    c.phases.forEach(function (phase) {
      var skipped = isPhaseSkipped(phase, s);
      html += '<div style="margin-bottom:10px"><strong>Phase ' + phase.number + ': ' + esc(phase.title) + '</strong>' + (skipped ? ' <span class="badge badge-skip">Skip</span>' : '') + '</div>';
      if (!skipped) {
        phase.steps.forEach(function (step) {
          var checked = !!s.checkedSteps[step.id];
          html += '<div style="font-size:13px;margin-left:12px">' + (checked ? "☑" : "☐") + " " + esc(step.text) + '</div>';
        });
      }
    });
    html += '<div class="modal-actions"><button id="modal-close" class="ghost">Close</button></div></div></div>';
    root.innerHTML = html;
    on("modal-overlay", "click", function (e) { if (e.target.id === "modal-overlay") closeModal(); });
    on("modal-close", "click", closeModal);
  }

  function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

  // ---------------------------------------------------------------------
  // Print
  // ---------------------------------------------------------------------
  function handlePrint() {
    buildPrintView(config, session, Date.now());
    // Laptops emit the tracker JSON alongside the printout. If the record
    // can't be named yet, stop the whole flow so the technician fixes the
    // fields rather than getting a printout with no matching export.
    if (exportsToTracker() && !exportForTracker(config, session)) return;
    window.print();
  }

  // ---------------------------------------------------------------------
  // Export for Deployment Tracker import
  // ---------------------------------------------------------------------
  function buildTrackerExport(c, s) {
    c = c || config; s = s || session;
    var prog = computeProgress(s);
    var finalComplete = c.finalChecklist.length > 0 && c.finalChecklist.every(function (f) { return !!s.finalChecked[f.id]; });
    var startedIso = s.startTime ? new Date(s.startTime).toISOString() : new Date(s.date + "T00:00:00").toISOString();
    return {
      source: "mli-deployment-checklist",
      exportVersion: 2,
      exportedAt: new Date().toISOString(),
      deviceCategory: activeCategory,
      device: {
        assetTag: (s.assetTag || s.device || "").toUpperCase(),
        serialNumber: (s.device || "").toUpperCase(),
        model: s.model || "",
        assignedUser: s.user || "",
        primaryLocation: "",
        technician: s.technician || "",
        deploymentType: s.deviceType === "retail" ? "autopilot" : "manual-install",
        dateStarted: startedIso,
        dateCompleted: finalComplete ? new Date().toISOString() : null,
        deviceNotes: "Imported from Deployment Checklist (" + c.meta.sop + "). " +
          prog.checkedSteps + "/" + prog.totalSteps + " steps checked across " + prog.phasesComplete + "/" + prog.totalPhases + " phases complete." +
          (s.physConditionNone ? "\n\nPhysical condition: No pre-existing damage observed." :
            s.physConditionNotes ? "\n\nPhysical condition — pre-existing damage: " + s.physConditionNotes : "") +
          (s.notes ? "\n\nTechnician notes: " + s.notes : "")
      },
      phases: c.phases.map(function (p) {
        return {
          title: p.title,
          skipped: isPhaseSkipped(p, s),
          complete: isPhaseComplete(p, s),
          requiresUserInteraction: !!p.requiresUserInteraction,
          steps: p.steps.map(function (st) {
            return { text: st.text, section: st.section || null, optional: !!st.optional, checked: !!s.checkedSteps[st.id] };
          })
        };
      }),
      prerequisites: c.prerequisites.map(function (p) {
        return { item: p.item, detail: p.detail, skipped: isPrereqSkipped(p, s), checked: !!s.prereqChecked[p.id] };
      }),
      finalChecklist: c.finalChecklist.map(function (f) {
        return { text: f.text, checked: !!s.finalChecked[f.id], requiresUserInteraction: !!f.requiresUserInteraction };
      })
    };
  }

  // Returns false (and tells the technician why) when the record isn't
  // complete enough to build the filename from.
  function exportForTracker(c, s) {
    c = c || config; s = s || session;
    var en = exportName(s.user, s.device, s.trainingPC);
    if (!en.ok) {
      alert("Cannot export the tracker JSON yet."
        + "\n\nThe filename is built from the user's name and the device serial."
        + "\nComplete these first:\n\n• "
        + en.problems.join("\n• "));
      return false;
    }
    downloadJson(buildTrackerExport(c, s), en.name + ".json");
    return true;
  }

  function buildPrintView(c, s, asOf) {
    asOf = asOf || s.lastUpdated || Date.now();
    var prog = computeProgress(s);
    var html = '<div class="p-header"><h1>' + esc(c.meta.title) + '</h1>' +
      '<div class="p-meta">' + esc(c.meta.subtitle) + ' &middot; ' + esc(c.meta.sop) + ' &middot; Revised ' + esc(c.meta.revised) + '</div>' +
      '<div class="p-meta">Technician: ' + esc(cen(s.technician) || "—") + ' &middot; User: ' + esc(cen(s.user) || "—") + ' &middot; SN: ' + esc(cen(s.device) || "—") + ' &middot; Asset Tag: ' + esc(cen(s.assetTag) || "—") + ' &middot; Model: ' + esc(cen(s.model) || "—") + ' &middot; Date: ' + esc(cen(s.date)) + '</div>' +
      '<div class="p-meta">Phases complete: ' + prog.phasesComplete + '/' + prog.totalPhases + ' &middot; Steps checked: ' + prog.checkedSteps + '/' + prog.totalSteps + '</div>' +
      '</div>';

    html += '<div class="p-phase"><strong>Prerequisites</strong>';
    c.prerequisites.forEach(function (p) {
      var skipped = isPrereqSkipped(p, s);
      var checked = !!s.prereqChecked[p.id];
      html += '<div class="p-step' + (skipped ? " p-skip" : "") + '">' + (skipped ? "—" : (checked ? "☑" : "☐")) + " " + esc(p.item) + " — " + esc(p.detail) + (skipped ? " (N/A)" : "") + '</div>';
    });
    html += '</div>';

    if (c.deviceTypes && c.deviceTypes.length) {
      html += '<div class="p-phase"><strong>Physical Condition</strong>';
      if (s.deviceType === "retail") {
        html += '<div class="p-step p-skip">— Skipped (Fresh from Retail — no pre-existing damage expected)</div>';
      } else if (s.physConditionNone) {
        html += '<div class="p-step">☑ No pre-existing damage observed</div>';
      } else if (s.physConditionNotes) {
        html += '<div class="p-step">☑ Damage documented:</div><div class="p-note">' + esc(cen(s.physConditionNotes, CENSOR_BLOCK_LONG)) + '</div>';
      } else if (s.deviceType === "refresh") {
        html += '<div class="p-step p-skip">☐ Not documented — required for Refresh / Redeployed devices</div>';
      } else {
        html += '<div class="p-step p-skip">— Not documented (optional for this device type)</div>';
      }
      html += '</div>';
    }

    var handoffPrinted = false;
    c.phases.forEach(function (phase) {
      if (!handoffPrinted && phase.requiresUserInteraction) {
        html += '<div class="p-handoff-divider">Device Handoff<span class="p-handoff-sub">Complete at the user\'s desk — the build above is done.</span></div>';
        handoffPrinted = true;
      }
      var skipped = isPhaseSkipped(phase, s);
      var trainingSkipped = !!(s.trainingPC && phase.requiresUserInteraction);
      var existingUserSkipped = !!(s.existingUser && phase.skipForExistingUser);
      var laptopOnlySkipped = !!(s.laptopOnly && phase.skipForLaptopOnly);
      html += '<div class="p-phase"><h3>Phase ' + phase.number + ': ' + esc(phase.title) + (skipped ? " — SKIPPED" : "") + '</h3>';
      if (skipped) {
        var skipMsg = trainingSkipped ? "Skipped — training PC, no assigned end user." :
          existingUserSkipped ? "Skipped — marked as an Existing User session." :
          laptopOnlySkipped ? "Skipped — marked as a Laptop-Only (No Peripherals) session." : (phase.skipNote || "");
        html += '<div class="p-skip">' + esc(skipMsg) + '</div>';
      } else {
        var lastSection = null;
        phase.steps.forEach(function (step) {
          var secSkipped = isStepSectionSkipped(phase.id, step, s);
          if (step.section && step.section !== lastSection) {
            var sectionHeaderSkipped = isSectionSkipped(phase.id, step.section, s) || isSectionAutoSkippedForExistingUser(phase, step.section, s);
            html += '<div class="p-step"><em>' + esc(step.section) + (sectionHeaderSkipped ? " — SKIPPED" : "") + '</em></div>';
            lastSection = step.section;
          }
          var checked = !!s.checkedSteps[step.id];
          html += '<div class="p-step' + (secSkipped ? " p-skip" : "") + '">' + (secSkipped ? "—" : (checked ? "☑" : "☐")) + " " + esc(step.text) + (step.optional ? " (if applicable)" : "") + '</div>';
          if (!secSkipped && step.note) html += '<div class="p-note">Note: ' + esc(step.note) + '</div>';
          if (!secSkipped && step.warning) html += '<div class="p-note">⚠ Warning: ' + esc(step.warning) + '</div>';
        });
      }
      html += '</div>';
    });

    html += '<div class="p-phase"><h3>Final Checklist</h3>';
    c.finalChecklist.forEach(function (f) {
      var skipped = isFinalItemSkipped(f, s);
      var checked = !!s.finalChecked[f.id];
      html += '<div class="p-step' + (skipped ? " p-skip" : "") + '">' + (skipped ? "—" : (checked ? "☑" : "☐")) + " " + esc(f.text) + (skipped ? " (N/A — training PC)" : "") + '</div>';
    });
    html += '</div>';

    html += '<div class="p-signatures">' +
      '<div class="p-sig-attest">By signing below, both parties confirm they have reviewed this checklist and are aware of the current state, configuration, and condition of this device, including all changes made during this deployment.</div>' +
      '<div class="p-sig-row">' +
      '<div class="p-sig-block"><div class="p-sig-line"></div><div class="p-sig-label">Technician Signature</div><div class="p-sig-line p-sig-line-date"></div><div class="p-sig-label">Date</div></div>' +
      '<div class="p-sig-block"><div class="p-sig-line"></div><div class="p-sig-label">User Signature</div><div class="p-sig-line p-sig-line-date"></div><div class="p-sig-label">Date</div></div>' +
      '</div></div>';

    if (s.notes) {
      html += '<div class="p-notes"><div class="p-notes-label">Notes</div><div class="p-notes-body">' + esc(cen(s.notes, CENSOR_BLOCK_LONG)) + '</div></div>';
    }

    html += '<div class="p-footer">' + esc("McKenna Labs IT") + ' &middot; ' + esc(c.meta.sop) + ' &middot; Generated ' + esc(cen(todayStr())) + '</div>';

    document.getElementById("print-view").innerHTML = html;
  }

  // ---------------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------------
  function init() {
    applyTheme();
    renderApp();
    document.addEventListener("keydown", function (e) {
      if (!e.altKey || e.ctrlKey || e.metaKey) return;
      if (String(e.key).toLowerCase() !== "c") return;
      var t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
      e.preventDefault();
      setCensor(!uiState.censor);
      renderApp();
    });
    document.addEventListener("click", function (e) {
      if (!optionsOpen) return;
      var wrap = document.getElementById("options-wrap");
      if (wrap && !wrap.contains(e.target)) {
        optionsOpen = false;
        renderApp();
      }
    });
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
