<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deployment Tracker — McKenna Labs IT</title>
<style>
:root {
  --navy:#1e3a5f; --navy-lt:#e8eef5;
  --teal:#0d9488; --teal-dk:#0f766e; --teal-lt:#ccfbf1; --teal-xlt:#f0fdfa;
  --bg:#f4f6f9; --card:#fff; --text:#1e293b; --muted:#64748b; --border:#e2e8f0;
  --green:#16a34a; --green-bg:#dcfce7;
  --amber:#d97706; --amber-bg:#fef3c7;
  --orange:#c2410c; --orange-bg:#ffedd5;
  --slate:#64748b; --slate-bg:#f1f5f9;
  --red:#dc2626; --red-bg:#fee2e2;
  --rad:10px;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.05);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--text);line-height:1.5}
button{cursor:pointer;font-family:inherit;font-size:13px}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}

/* HEADER */
header{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;height:54px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-icon{width:30px;height:30px;background:var(--teal);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-title{font-size:15px;font-weight:700;white-space:nowrap}
.brand-sub{font-size:11px;color:#94a3b8}
.hdr-actions{display:flex;gap:6px}
.hdr-btn{background:transparent;border:1px solid rgba(255,255,255,.22);color:#cbd5e1;border-radius:6px;padding:5px 11px;transition:all .15s;white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.1);color:#fff}

main{max-width:1150px;margin:0 auto;padding:22px 20px 60px}

/* TILES */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);box-shadow:var(--shadow);padding:14px 18px}
.tile-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.tile-value{font-size:26px;font-weight:700;color:var(--navy);line-height:1.3}

/* TOOLBAR */
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px;align-items:center}
.toolbar input[type=search]{flex:1;min-width:200px;border:1px solid var(--border);border-radius:7px;padding:7px 12px;background:var(--card)}
.toolbar select{border:1px solid var(--border);border-radius:7px;padding:7px 10px;background:var(--card)}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-lt)}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:7px;padding:7px 14px;font-weight:600;white-space:nowrap;transition:all .15s}
a.btn{text-decoration:none}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-dk)}
.btn-secondary{background:var(--navy-lt);color:var(--navy);border:1px solid var(--border)}
.btn-secondary:hover{background:#d6e1ee}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{background:var(--card);color:var(--text)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid #fca5a5}
.btn-danger:hover{background:#fecaca}
.btn-sm{padding:4px 10px;font-size:12px}

/* TABLE */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:9px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--navy)}
th .dir{font-size:9px;margin-left:3px}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--teal-xlt)}
.serial{font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:13px;color:var(--navy)}
.sub{font-size:12px;color:var(--muted)}

/* SELECTION */
.sel-col{width:34px;text-align:center;cursor:default}
.sel-col input{width:15px;height:15px;accent-color:var(--teal);cursor:pointer;vertical-align:middle}
.selbar{display:flex;align-items:center;gap:12px;background:var(--teal-xlt);border:1px solid #99f6e4;border-radius:var(--rad);padding:8px 14px;margin-bottom:12px;font-size:13px}
.selbar b{color:var(--teal-dk)}
.selbar .spacer{flex:1}
.selbar select{border:1px solid #99f6e4;border-radius:7px;padding:5px 9px;background:var(--card);font-size:13px;cursor:pointer}
.selbar select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-lt)}

/* PILLS */
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.pill-deployed{background:var(--green-bg);color:var(--green)}
.pill-in-setup{background:var(--teal-lt);color:var(--teal-dk)}
.pill-storage{background:var(--slate-bg);color:var(--slate)}
.pill-repair{background:var(--amber-bg);color:#92400e}
.pill-retiring{background:var(--orange-bg);color:var(--orange)}
.pill-retired{background:var(--red-bg);color:var(--red)}
.cat-chip{display:inline-block;background:var(--navy-lt);color:var(--navy);font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:10px;white-space:nowrap}

/* PROGRESS */
.prog{background:#e2e8f0;border-radius:4px;height:6px;min-width:70px;overflow:hidden}
.prog>div{height:100%;background:var(--teal);border-radius:4px}
.prog.full>div{background:var(--green)}
.prog-txt{font-size:11px;color:var(--muted);margin-top:2px}

/* EMPTY */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty h2{font-size:17px;color:var(--text);margin:10px 0 6px}
.empty p{margin-bottom:20px}
.empty .btn-group{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* DETAIL */
.detail-top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.detail-title{font-size:20px;font-weight:700;color:var(--navy);flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:720px){.meta-grid{grid-template-columns:1fr 1fr}}
.mf label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.mf input,.mf select,.mf textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:7px 10px;background:var(--bg)}
.mf input:focus,.mf select:focus,.mf textarea:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 2px var(--teal-lt)}
.mf-wide{grid-column:1/-1}
.mf textarea{resize:vertical;min-height:54px}
.cf-row{display:flex;gap:8px;margin-bottom:8px}
.cf-row input{border:1px solid var(--border);border-radius:7px;padding:6px 10px;background:var(--bg)}
.cf-row input:focus{outline:none;border-color:var(--teal);background:#fff}
.cf-label{flex:0 0 190px}
.cf-value{flex:1;min-width:0}
@media(max-width:600px){.cf-row{flex-wrap:wrap}.cf-label{flex:1 1 100%}}

/* DEPLOYMENT VIEW */
.dep-summary{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted)}
.dep-summary b{color:var(--text)}
.dep-bar{flex:1;min-width:160px;display:flex;align-items:center;gap:10px}
details.phase{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--card);overflow:hidden}
details.phase summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;font-weight:600;background:var(--bg)}
details.phase summary::-webkit-details-marker{display:none}
details.phase summary .chev{color:var(--muted);font-size:11px;transition:transform .15s}
details.phase[open] summary .chev{transform:rotate(90deg)}
details.phase summary .ct{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap}
.ph-num{background:var(--navy);color:#fff;border-radius:5px;padding:1px 8px;font-size:11.5px;font-family:ui-monospace,Consolas,monospace;flex-shrink:0}
.badge{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.4px}
.badge-done{background:var(--green-bg);color:var(--green)}
.badge-skip{background:var(--slate-bg);color:var(--slate)}
.badge-partial{background:var(--amber-bg);color:#92400e}
.dstep{display:flex;gap:10px;padding:7px 16px;border-top:1px solid var(--border);font-size:13px;align-items:flex-start}
.dstep .mk{flex-shrink:0;width:17px;text-align:center;font-weight:700}
.dstep .mk.y{color:var(--green)}
.dstep .mk.n{color:#cbd5e1}
.dstep.skip{opacity:.55;font-style:italic}
.dstep .sec{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--teal-dk);margin-right:6px}
.skipnote{padding:9px 16px;border-top:1px solid var(--border);font-size:12.5px;font-style:italic;color:var(--muted)}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-hdr h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}

/* DIALOG */
dialog{margin:auto;border:none;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:0;width:min(460px,92vw);max-height:88vh}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dlg-hdr{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.dlg-hdr h2{font-size:16px;color:var(--navy)}
.dlg-x{background:none;border:none;font-size:18px;color:var(--muted);line-height:1}
.dlg-body{padding:18px 22px;overflow-y:auto}
.dlg-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px}
.ff{margin-bottom:13px}
.ff label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}
.ff input,.ff select{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 11px;background:var(--bg)}
.ff input:focus,.ff select:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 2px var(--teal-lt)}
.ff .note{font-size:12px;color:var(--muted);margin-top:4px}
.ff textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 11px;background:var(--bg);font-family:ui-monospace,Consolas,monospace;font-size:12px;resize:vertical}
.ff textarea:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 2px var(--teal-lt)}
#dlg-import{width:min(580px,92vw)}

/* PIN */
.pin-row{display:flex;align-items:center;gap:8px}
.pin-input{width:200px;border:1px solid var(--border);border-radius:7px;padding:8px 11px;background:var(--bg);
  font-family:ui-monospace,Consolas,monospace;font-size:15px;letter-spacing:2px}
.pin-input:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 2px var(--teal-lt)}
.pin-print{display:none}

/* TOAST + DROP */
#toasts{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:11px 17px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:all .25s;max-width:320px}
.toast.show{opacity:1;transform:none}
.toast.ok{background:#166534}
.toast.err{background:var(--red)}
#drop{display:none;position:fixed;inset:0;z-index:150;background:rgba(30,58,95,.85);color:#fff;align-items:center;justify-content:center;font-size:19px;font-weight:600;pointer-events:none}
#drop.on{display:flex}

@media print{
  header,.toolbar,.tiles,.detail-top .btn,.btn,dialog,#toasts,.sel-col,.selbar{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card,details.phase{box-shadow:none;page-break-inside:avoid}
  details.phase{display:block}
  details.phase summary .chev{display:none}
  /* the live field prints as dots when masked — print the value instead */
  .pin-row{display:none!important}
  .pin-print{display:block;font-family:ui-monospace,Consolas,monospace;font-size:15px;letter-spacing:1px}
  .pin-print-label{font-family:inherit;font-weight:700;letter-spacing:0;margin-right:6px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4M7 8h.01M11 8h6M7 12h.01M11 12h6"/>
      </svg>
    </div>
    <div>
      <div class="brand-title">Deployment Tracker</div>
      <div class="brand-sub">McKenna Labs IT &middot; high-value asset &amp; deployment log</div>
    </div>
  </div>
  <div class="hdr-actions">
    <button class="hdr-btn" onclick="exportCSV()">CSV</button>
    <button class="hdr-btn" onclick="backupJSON()">Backup</button>
    <button class="hdr-btn" onclick="document.getElementById('file-restore').click()">Restore</button>
  </div>
</header>
<main id="app"></main>

<dialog id="dlg-import">
  <div class="dlg-hdr"><h2>Import JSON</h2><button class="dlg-x" onclick="document.getElementById('dlg-import').close()">&#10005;</button></div>
  <div class="dlg-body">
    <div class="ff">
      <label>Paste JSON</label>
      <textarea id="imp-paste" rows="9" spellcheck="false" placeholder='Paste a Deployment Checklist export or asset JSON here&mldr;'></textarea>
      <div class="note">Accepts Deployment Checklist exports and asset JSON (single object or an array of them). Prefer files? Use Choose Files below — dragging .json files anywhere onto the page works too.</div>
    </div>
  </div>
  <div class="dlg-foot">
    <button class="btn btn-ghost" onclick="document.getElementById('dlg-import').close()">Cancel</button>
    <button class="btn btn-secondary" onclick="document.getElementById('dlg-import').close();document.getElementById('file-import').click()">Choose Files&mldr;</button>
    <button class="btn btn-primary" onclick="submitPastedImport()">Import Pasted JSON</button>
  </div>
</dialog>

<div id="toasts"></div>
<div id="drop">Drop checklist JSON to import</div>
<input type="file" id="file-import" accept=".json,application/json" multiple style="display:none" onchange="handleImportFiles(this.files);this.value=''">
<input type="file" id="file-restore" accept=".json,application/json" style="display:none" onchange="handleRestoreFile(this.files);this.value=''">

<script>
'use strict';

// ═════════════════════════════════════════════════════════════════
// CONSTANTS
// ═════════════════════════════════════════════════════════════════
const LS_KEY = 'mli-asset-tracker-v2';

const CATEGORIES = {
  windows: 'Windows PC',
  ipad:    'iPad / Tablet',
  printer: 'Printer',
  phone:   'Phone / Mobile',
  scanner: 'Scanner Gun',
  other:   'Other Asset'
};

const STATUSES = {
  'in-setup': 'In Setup',
  'deployed': 'Deployed',
  'storage':  'In Storage',
  'repair':   'In Repair',
  'retiring': 'Pending Retirement',
  'retired':  'Retired'
};

// ═════════════════════════════════════════════════════════════════
// STATE + STORAGE
// ═════════════════════════════════════════════════════════════════
let data = load();
let ui = { view: 'list', itemId: null, search: '', cat: 'all', status: 'all', sortKey: 'updated', sortDir: -1, selected: new Set(), pinShown: false };

// Where the device PIN is allowed to travel. It is a live credential,
// so every destination is opt-in — flip a flag here and that output
// starts carrying PINs, with no other code change needed.
//   browser  — always true in practice; PINs live in localStorage
//   print    — the printed handoff sheet
//   csv      — Export CSV (shared file; off by default)
//   backup   — Backup JSON (off by default, so Restore drops PINs)
const PIN_EXPORT = { print: true, csv: false, backup: false };

// Identifier fields are stored uppercase everywhere — typed, imported, or
// restored — so the same device never appears twice in different casing.
const UPPERCASE_FIELDS = ['serial', 'assetTag', 'model'];

function normalizeItem(it) {
  if (!Array.isArray(it.customFields)) it.customFields = [];
  if (!Array.isArray(it.documents)) it.documents = [];
  if (typeof it.pin !== 'string') it.pin = '';
  for (const f of UPPERCASE_FIELDS) {
    if (typeof it[f] === 'string') it[f] = it[f].trim().toUpperCase();
  }
  return it;
}

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (Array.isArray(d.items)) { d.items.forEach(normalizeItem); return d; }
    }
  } catch (e) { /* fall through */ }
  return { items: [] };
}

function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); }
  catch (e) { toast('Could not save — browser storage unavailable.', 'err'); }
}

// ═════════════════════════════════════════════════════════════════
// UTILITIES
// ═════════════════════════════════════════════════════════════════
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function getItem(id) { return data.items.find(i => i.id === id); }

function itemLabel(it) { return it.assetTag || it.serial || 'Unnamed item'; }

// ═════════════════════════════════════════════════════════════════
// EXPORT FILE NAMING — first initial + last name + serial
// e.g. Christian Jones / ABC123456  ->  CJonesABC123456
// Kept identical to the same helpers in deployment-checklist.html so
// a device's PDF and its import JSON land on the same filename.
// ═════════════════════════════════════════════════════════════════
const NAME_SUFFIXES = /^(jr|sr|ii|iii|iv|v)\.?$/i;

// '' when the value isn't a usable person name (blank, or one word).
function nameKey(full) {
  let s = String(full || '').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  // "Jones, Christian" -> "Christian Jones"
  const comma = s.indexOf(',');
  if (comma > -1) s = (s.slice(comma + 1) + ' ' + s.slice(0, comma)).replace(/\s+/g, ' ').trim();
  const parts = s.split(' ')
    .map(w => w.replace(/[^A-Za-z]/g, ''))       // drops apostrophes, hyphens, periods
    .filter(w => w && !NAME_SUFFIXES.test(w));
  if (parts.length < 2) return '';               // need a first AND a last name
  const last = parts[parts.length - 1];
  // Casing is left as typed past the first letter, so McKenna stays McKenna.
  return parts[0].charAt(0).toUpperCase() + last.charAt(0).toUpperCase() + last.slice(1);
}

function serialKey(serial) {
  return String(serial || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
}

// { ok, name, problems[] } — problems are technician-facing sentences.
function exportName(user, serial) {
  const nk = nameKey(user), sk = serialKey(serial);
  const problems = [];
  if (!nk) {
    const typed = String(user || '').trim();
    problems.push(typed
      ? 'Assigned User needs a first and last name — "' + typed + '" is only one name.'
      : 'Assigned User is empty.');
  }
  if (!sk) problems.push('Serial Number is empty.');
  return { ok: !problems.length, name: nk + sk, problems };
}

function touch(it) { it.updatedAt = new Date().toISOString(); }

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3200);
}

function dl(text, name, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 800);
}

// ═════════════════════════════════════════════════════════════════
// IMPORT — normalize both checklist export formats into one shape
//
// Format A (session export / "BUrias" style): { config, session }
//   Carries the full checklist config plus checked-state maps; all
//   skip logic (device type, training PC, manual sections) is
//   re-derived here exactly as the checklist tool derives it.
// Format B (print-time export): { source:'mli-deployment-checklist',
//   device, phases, prerequisites, finalChecklist } — already flat.
// Format C (asset JSON): a single object or array of objects with a
//   valid `category` plus serial and/or assetTag — for printers,
//   iPads, scanners, phones, and other non-checklist items.
//   Optional: model, user, location, technician, status, notes,
//   customFields [{label, value}], documents [{label, url}].
//   Matched to existing items by serial, then asset tag; custom
//   fields merge by label, documents merge by URL.
// ═════════════════════════════════════════════════════════════════
function parseChecklistJson(obj) {
  if (obj && obj.config && obj.session && Array.isArray(obj.config.phases)) return normalizeSession(obj.config, obj.session);
  if (obj && obj.source === 'mli-deployment-checklist' && obj.device) return normalizePrintExport(obj);
  return null;
}

function normalizeSession(cfg, s) {
  const dtId = s.deviceType || null;
  const dt = (cfg.deviceTypes || []).find(d => d.id === dtId);
  const secSkipped = (phaseId, section) => !!(s.manualSkippedSections || {})[phaseId + '::' + section];

  const phases = (cfg.phases || []).map(p => {
    const skipped = !!(dtId && (p.skipForDeviceTypes || []).includes(dtId)) || !!(s.trainingPC && p.requiresUserInteraction);
    const steps = (p.steps || []).map(st => ({
      text: st.text,
      section: st.section || null,
      optional: !!st.optional,
      skipped: !!(st.section && secSkipped(p.id, st.section)),
      checked: !!(s.checkedSteps || {})[st.id]
    }));
    const required = steps.filter(st => !st.optional && !st.skipped);
    return {
      number: p.number, title: p.title, skipped,
      excluded: !!p.requiresUserInteraction,
      skipNote: skipped ? (s.trainingPC && p.requiresUserInteraction ? 'Skipped — training PC, no end user.' : p.skipNote || 'Skipped for this device type.') : '',
      complete: !skipped && required.length > 0 && required.every(st => st.checked),
      steps
    };
  });

  const prereqs = (cfg.prerequisites || []).map(p => ({
    text: p.item + (p.detail ? ' — ' + p.detail : ''),
    skipped: !!(dtId && (p.skipForDeviceTypes || []).includes(dtId)),
    checked: !!(s.prereqChecked || {})[p.id]
  }));

  const final = (cfg.finalChecklist || []).map(f => ({
    text: f.text,
    skipped: !!(s.trainingPC && f.requiresUserInteraction),
    excluded: !!f.requiresUserInteraction || isHandoffFinal(f.text),
    checked: !!(s.finalChecked || {})[f.id]
  }));

  return finishDep({
    sessionId: s.sessionId || null,
    sop: (cfg.meta || {}).sop || '',
    title: (cfg.meta || {}).title || 'Deployment Checklist',
    serial: (s.device || '').trim().toUpperCase(),
    assetTag: '',
    user: s.user || '',
    technician: s.technician || '',
    deviceTypeLabel: dt ? dt.label : (dtId || '—'),
    trainingPC: !!s.trainingPC,
    date: s.date || null,
    notes: s.notes || '',
    physCondition: s.physConditionNone ? 'No pre-existing damage observed.' : (s.physConditionNotes || ''),
    phases, prereqs, final
  });
}

// Handoff work (done with the user present, post-assignment) is
// excluded from the deployment %. Session exports carry the
// requiresUserInteraction flag; print exports fall back to titles.
const HANDOFF_TITLES = ['hardware & workspace setup', 'multi-factor authentication setup'];

// Final-checklist lines that verify the handoff phases above. Print
// exports strip every flag from finalChecklist, so these match on text.
const HANDOFF_FINAL_TEXTS = [
  'all peripherals connected and functioning',
  'mfa registered and test sign-in successful'
];

function isHandoffTitle(t) {
  return HANDOFF_TITLES.includes(String(t || '').trim().toLowerCase());
}

function isHandoffFinal(t) {
  return HANDOFF_FINAL_TEXTS.includes(String(t || '').trim().toLowerCase());
}

// Checklist category -> tracker category. Exports from before this mapping
// existed carry no deviceCategory, so they keep landing as Windows PCs.
const CHECKLIST_CATEGORY_MAP = {
  laptop: 'windows',
  ipad: 'ipad',
  'scanner-gun': 'scanner'
};

const CHECKLIST_CATEGORY_LABEL = {
  ipad: 'iPad / iOS Enrollment',
  'scanner-gun': 'Scanner Gun'
};

function normalizePrintExport(obj) {
  const d = obj.device || {};
  const cat = CHECKLIST_CATEGORY_MAP[obj.deviceCategory] || 'windows';
  const phases = (obj.phases || []).map((p, i) => ({
    number: i + 1, title: p.title,
    skipped: !!p.skipped,
    excluded: !!p.requiresUserInteraction || isHandoffTitle(p.title),
    skipNote: p.skipped ? 'Skipped for this device type.' : '',
    complete: !!p.complete,
    steps: (p.steps || []).map(st => ({
      text: st.text, section: st.section || null,
      optional: !!st.optional, skipped: false, checked: !!st.checked
    }))
  }));
  const prereqs = (obj.prerequisites || []).map(p => ({
    text: p.item + (p.detail ? ' — ' + p.detail : ''), skipped: !!p.skipped, checked: !!p.checked
  }));
  const final = (obj.finalChecklist || []).map(f => ({
    text: f.text, skipped: false,
    excluded: !!f.requiresUserInteraction || isHandoffFinal(f.text),
    checked: !!f.checked
  }));

  return finishDep({
    sessionId: null,
    sop: '', title: 'Deployment Checklist',
    serial: (d.serialNumber || '').trim().toUpperCase(),
    assetTag: (d.assetTag || '').trim().toUpperCase(),
    user: d.assignedUser || '',
    technician: d.technician || '',
    category: cat,
    deviceTypeLabel: CHECKLIST_CATEGORY_LABEL[obj.deviceCategory] ||
      (d.deploymentType === 'autopilot' ? 'Autopilot' : 'Manual Install'),
    trainingPC: false,
    date: d.dateStarted ? d.dateStarted.slice(0, 10) : null,
    notes: d.deviceNotes || '',
    physCondition: '',
    phases, prereqs, final
  });
}

// shared final pass: compute progress totals + completion pct.
// Handoff work (excluded) still counts toward the step/final tallies
// shown on the record, but not toward the deployment % — the % tracks
// staging only, so a device reads 100% and "deployed" once it is ready
// to hand over, even with the user-present phases still open.
function finishDep(dep) {
  let steps = 0, stepsChecked = 0, counted = 0, countedChecked = 0;
  for (const p of dep.phases) {
    if (p.skipped) continue;
    for (const st of p.steps) {
      if (st.optional || st.skipped) continue;
      steps++;
      if (st.checked) stepsChecked++;
      if (!p.excluded) {
        counted++;
        if (st.checked) countedChecked++;
      }
    }
  }
  const appFinal = dep.final.filter(f => !f.skipped);
  const finalChecked = appFinal.filter(f => f.checked).length;
  const countedFinal = appFinal.filter(f => !f.excluded);
  const activePhases = dep.phases.filter(p => !p.skipped);
  const pctTotal = counted + countedFinal.length;
  const pctDone = countedChecked + countedFinal.filter(f => f.checked).length;
  dep.progress = {
    steps, stepsChecked,
    phases: activePhases.length,
    phasesComplete: activePhases.filter(p => p.complete).length,
    final: appFinal.length, finalChecked,
    pct: pctTotal ? Math.round(pctDone / pctTotal * 100) : 0,
    complete: pctTotal > 0 && pctDone === pctTotal
  };
  dep.importedAt = new Date().toISOString();
  return dep;
}

// Create or update an item from a normalized deployment.
// Match priority: same sessionId → same serial → new item.
function findDepTarget(dep) {
  let it = dep.sessionId ? data.items.find(i => i.dep && i.dep.sessionId === dep.sessionId) : null;
  if (!it && dep.serial) it = data.items.find(i => (i.serial || '').toUpperCase() === dep.serial);
  return it || null;
}

function applyDeployment(dep, allowUpdate = true) {
  let it = findDepTarget(dep);
  if (it && !allowUpdate) return { item: it, created: false, skipped: true };
  const created = !it;
  if (!it) {
    it = {
      id: uid(), serial: dep.serial, assetTag: dep.assetTag, model: '',
      user: '', location: '', technician: '', category: dep.category || 'windows',
      status: 'in-setup', notes: '', pin: '', customFields: [], documents: [],
      addedAt: new Date().toISOString(), updatedAt: null, dep: null
    };
    data.items.unshift(it);
  }
  it.dep = dep;
  if (dep.user) it.user = dep.user;
  if (dep.technician) it.technician = dep.technician;
  if (dep.assetTag && !it.assetTag) it.assetTag = dep.assetTag;
  it.status = dep.progress.complete ? 'deployed' : 'in-setup';
  touch(it);
  return { item: it, created };
}

function parseAssetJson(obj) {
  const arr = Array.isArray(obj) ? obj : [obj];
  const out = [];
  for (const a of arr) {
    if (!a || typeof a !== 'object' || !CATEGORIES[a.category]) return null;
    const serial = String(a.serial || '').trim().toUpperCase();
    const assetTag = String(a.assetTag || '').trim().toUpperCase();
    if (!serial && !assetTag) return null;
    out.push({
      serial, assetTag,
      model: String(a.model || '').trim().toUpperCase(),
      user: String(a.user || a.assignedUser || '').trim(),
      location: String(a.location || '').trim(),
      technician: String(a.technician || '').trim(),
      category: a.category,
      status: STATUSES[a.status] ? a.status : 'in-setup',
      notes: String(a.notes || ''),
      customFields: Array.isArray(a.customFields)
        ? a.customFields.filter(f => f && (f.label || f.value)).map(f => ({ label: String(f.label || ''), value: String(f.value || '') }))
        : [],
      documents: Array.isArray(a.documents)
        ? a.documents.filter(d => d && d.url).map(d => ({ label: String(d.label || ''), url: String(d.url).trim() }))
        : []
    });
  }
  return out.length ? out : null;
}

// Create or update an item from an asset object.
// Match priority: serial → asset tag → new item.
function findAssetTarget(a) {
  let it = a.serial ? data.items.find(i => (i.serial || '').toUpperCase() === a.serial) : null;
  if (!it && a.assetTag) it = data.items.find(i => (i.assetTag || '').toUpperCase() === a.assetTag);
  return it || null;
}

function applyAsset(a, allowUpdate = true) {
  let it = findAssetTarget(a);
  if (it && !allowUpdate) return { item: it, created: false, skipped: true };
  const created = !it;
  if (!it) {
    it = {
      id: uid(), serial: '', assetTag: '', model: '', user: '', location: '',
      technician: '', category: a.category, status: a.status, notes: '', pin: '',
      customFields: [], documents: [],
      addedAt: new Date().toISOString(), updatedAt: null, dep: null
    };
    data.items.unshift(it);
  }
  for (const k of ['serial','assetTag','model','user','location','technician','category','status','notes']) {
    if (a[k]) it[k] = a[k];
  }
  for (const f of a.customFields) {
    const ex = f.label ? it.customFields.find(x => (x.label || '').toLowerCase() === f.label.toLowerCase()) : null;
    if (ex) { if (f.value) ex.value = f.value; }
    else it.customFields.push({ id: uid(), label: f.label, value: f.value });
  }
  for (const d of a.documents) {
    if (!it.documents.some(x => (x.url || '').toLowerCase() === d.url.toLowerCase())) {
      it.documents.push({ id: uid(), label: d.label, url: d.url, addedAt: new Date().toISOString() });
    }
  }
  touch(it);
  return { item: it, created };
}

// One JSON document (from a file or pasted text) → import operations.
// Nothing is applied yet; throws if the document is unrecognized.
function parseToOps(text, ops) {
  const obj = JSON.parse(text);
  const dep = parseChecklistJson(obj);
  if (dep) { ops.push({ kind: 'dep', dep }); return; }
  const assets = parseAssetJson(obj);
  if (!assets) throw new Error('unrecognized format');
  for (const a of assets) ops.push({ kind: 'asset', asset: a });
}

// Apply a parsed batch. If any op matches an existing item, the tech
// confirms once (per batch) before those items are overwritten;
// declining keeps existing items untouched while new items still import.
function executeImport(ops, failed) {
  const matchLabels = [...new Set(ops
    .map(op => op.kind === 'dep' ? findDepTarget(op.dep) : findAssetTarget(op.asset))
    .filter(Boolean).map(itemLabel))];
  let allowUpdate = true;
  if (matchLabels.length) {
    const shown = matchLabels.slice(0, 8).join(', ') + (matchLabels.length > 8 ? ' … and ' + (matchLabels.length - 8) + ' more' : '');
    allowUpdate = confirm('This import matches ' + matchLabels.length + ' existing item' + (matchLabels.length > 1 ? 's' : '') + ':\n\n' + shown +
      '\n\nOK — overwrite them with the imported data.\nCancel — keep existing items untouched (new items still import).');
  }
  let created = 0, updated = 0, skipped = 0, lastItem = null;
  for (const op of ops) {
    const res = op.kind === 'dep' ? applyDeployment(op.dep, allowUpdate) : applyAsset(op.asset, allowUpdate);
    if (res.skipped) { skipped++; continue; }
    lastItem = res.item;
    res.created ? created++ : updated++;
  }
  finishImportBatch(created, updated, failed, lastItem, skipped);
}

function openImport() {
  document.getElementById('imp-paste').value = '';
  document.getElementById('dlg-import').showModal();
}

function submitPastedImport() {
  const text = document.getElementById('imp-paste').value.trim();
  if (!text) { toast('Paste JSON first, or use Choose Files.', 'err'); return; }
  const ops = [];
  try { parseToOps(text, ops); }
  catch (err) { toast('Could not import — not valid checklist or asset JSON.', 'err'); return; }
  document.getElementById('dlg-import').close();
  executeImport(ops, 0);
}

function handleImportFiles(files) {
  if (!files || !files.length) return;
  let pending = files.length, failed = 0;
  const ops = [];
  const done = () => { if (--pending === 0) executeImport(ops, failed); };
  for (const file of files) {
    const reader = new FileReader();
    reader.onload = e => {
      try { parseToOps(e.target.result, ops); }
      catch (err) { failed++; }
      done();
    };
    reader.onerror = () => { failed++; done(); };
    reader.readAsText(file);
  }
}

function finishImportBatch(created, updated, failed, lastItem, skipped) {
  save();
  const parts = [];
  if (created) parts.push(created + ' added');
  if (updated) parts.push(updated + ' updated');
  if (skipped) parts.push(skipped + ' skipped (kept existing)');
  if (failed) parts.push(failed + ' failed');
  toast('Import: ' + (parts.join(', ') || 'nothing imported'), failed && !created && !updated ? 'err' : 'ok');
  if (created + updated === 1 && lastItem) { ui.view = 'detail'; ui.itemId = lastItem.id; }
  render();
}

// ═════════════════════════════════════════════════════════════════
// ITEM CRUD — items only enter via import; edits happen in detail view
// ═════════════════════════════════════════════════════════════════
function setField(id, field, value) {
  const it = getItem(id);
  if (!it) return;
  it[field] = UPPERCASE_FIELDS.includes(field) ? value.trim().toUpperCase() : value;
  touch(it); save();
  if (['category','status'].includes(field)) render();
}

// Reveal/hide the PIN. Flips the live input in place instead of
// re-rendering, so a half-typed PIN isn't thrown away by the toggle.
function togglePin(id) {
  const input = document.getElementById('pin-input');
  const btn = document.getElementById('pin-eye');
  if (!input) return;
  ui.pinShown = !ui.pinShown;
  pinShownFor = ui.pinShown ? id : null;
  input.type = ui.pinShown ? 'text' : 'password';
  if (btn) {
    btn.textContent = ui.pinShown ? 'Hide' : 'Show';
    btn.title = ui.pinShown ? 'Hide the PIN' : 'Reveal the PIN';
  }
}

// PINs are short and often numeric; keep them as typed but drop
// surrounding whitespace so a stray copy-paste space doesn't stick.
function setPin(id, value) {
  const it = getItem(id);
  if (!it) return;
  it.pin = String(value).trim();
  touch(it); save();
}

// Print the item sheet. The browser takes its Save-as-PDF filename from
// document.title, so the title is swapped for the export name and put
// back afterward. Blocked until the fields the name is built from exist.
function printItem(id) {
  const it = getItem(id);
  if (!it) return;
  const en = exportName(it.user, it.serial);
  if (!en.ok) {
    toast('Cannot print yet — complete these first: ' + en.problems.join(' '), 'err');
    return;
  }
  const prev = document.title;
  const restore = () => {
    document.title = prev;
    window.removeEventListener('afterprint', restore);
  };
  document.title = en.name;
  window.addEventListener('afterprint', restore);
  window.print();
  // Safety net for browsers that never fire afterprint.
  setTimeout(restore, 60000);
}

function clearPin(id) {
  const it = getItem(id);
  if (!it || !it.pin) return;
  if (!confirm('Clear the stored PIN for this device?')) return;
  it.pin = '';
  touch(it); save();
  toast('PIN cleared.');
  render();
}

function addCF(id) {
  const it = getItem(id); if (!it) return;
  it.customFields.push({ id: uid(), label: '', value: '' });
  touch(it); save(); render();
}
function setCF(id, fid, key, value) {
  const it = getItem(id); if (!it) return;
  const f = it.customFields.find(f => f.id === fid); if (!f) return;
  f[key] = value; touch(it); save();
}
function delCF(id, fid) {
  const it = getItem(id); if (!it) return;
  it.customFields = it.customFields.filter(f => f.id !== fid);
  touch(it); save(); render();
}

// Documents — links to scanned handoff paperwork (signed checklist etc.)
// Only http(s)/file links are ever rendered as clickable, so a pasted
// "javascript:" or other active scheme can never execute from the page.
function safeUrl(u) {
  return /^(https?|file):/i.test(String(u || '').trim()) ? String(u).trim() : '';
}

function addDoc(id) {
  const it = getItem(id); if (!it) return;
  it.documents.push({ id: uid(), label: '', url: '', addedAt: new Date().toISOString() });
  touch(it); save(); render();
}
function setDoc(id, docId, key, value) {
  const it = getItem(id); if (!it) return;
  const d = it.documents.find(d => d.id === docId); if (!d) return;
  value = value.trim();
  // bare "sharepoint.com/..." pastes get a scheme so the link opens
  if (key === 'url' && value && !/^[a-z][a-z0-9+.-]*:/i.test(value)) value = 'https://' + value;
  d[key] = value;
  touch(it); save();
  if (key === 'url') render(); // refresh the open-link button; label edits keep focus flow
}
function delDoc(id, docId) {
  const it = getItem(id); if (!it) return;
  it.documents = it.documents.filter(d => d.id !== docId);
  touch(it); save(); render();
}

function delItem(id) {
  const it = getItem(id); if (!it) return;
  if (!confirm('Delete "' + itemLabel(it) + '"? This cannot be undone.')) return;
  data.items = data.items.filter(i => i.id !== id);
  save();
  ui.view = 'list'; ui.itemId = null;
  toast('Item deleted.');
  render();
}

function detachDep(id) {
  const it = getItem(id); if (!it || !it.dep) return;
  if (!confirm('Remove the imported deployment record from this item?')) return;
  it.dep = null; touch(it); save(); render();
}

// ═════════════════════════════════════════════════════════════════
// EXPORT
// ═════════════════════════════════════════════════════════════════
function exportCSV() {
  const rows = [['Serial','Asset Tag','Category','Model','User','Location','Technician','Status']
    .concat(PIN_EXPORT.csv ? ['PIN'] : [])
    .concat(['Deployment %','Deployment Date','Updated','Custom Fields','Documents','Notes'])];
  for (const it of data.items) {
    rows.push([
      it.serial, it.assetTag, CATEGORIES[it.category] || it.category, it.model, it.user, it.location, it.technician,
      STATUSES[it.status] || it.status,
      ...(PIN_EXPORT.csv ? [it.pin || ''] : []),
      it.dep ? it.dep.progress.pct + '%' : '',
      it.dep ? (it.dep.date || '') : '',
      it.updatedAt ? it.updatedAt.slice(0, 10) : '',
      it.customFields.filter(f => f.label || f.value).map(f => f.label + ': ' + f.value).join('; '),
      (it.documents || []).filter(d => d.url).map(d => (d.label ? d.label + ': ' : '') + d.url).join('; '),
      it.notes
    ]);
  }
  const csv = rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
  dl(csv, 'deployment-tracker-' + new Date().toISOString().slice(0, 10) + '.csv', 'text/csv');
}

function backupJSON() {
  let items = data.items;
  if (!PIN_EXPORT.backup) {
    const withPins = items.filter(i => i.pin).length;
    if (withPins && !confirm(withPins + ' item' + (withPins > 1 ? 's have' : ' has') +
        ' a stored PIN. Backups exclude PINs, so restoring this file will not bring them back.\n\nContinue?')) return;
    items = items.map(i => { const { pin, ...rest } = i; return rest; });
  }
  dl(JSON.stringify({ app: 'mli-asset-tracker', version: 2, exportedAt: new Date().toISOString(), items }, null, 2),
     'deployment-tracker-backup-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json');
}

function handleRestoreFile(files) {
  if (!files || !files.length) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!Array.isArray(d.items)) throw new Error('bad format');
      if (!confirm('Restore backup with ' + d.items.length + ' item(s)? This replaces all current data.')) return;
      d.items.forEach(normalizeItem);
      data = { items: d.items };
      save();
      ui.view = 'list'; ui.itemId = null;
      toast('Backup restored.', 'ok');
      render();
    } catch (err) { toast('Not a valid tracker backup file.', 'err'); }
  };
  reader.readAsText(files[0]);
}

// ═════════════════════════════════════════════════════════════════
// RENDER — LIST
// ═════════════════════════════════════════════════════════════════
// Tracks which item the PIN was last revealed on, so leaving the item
// (or the detail view) re-masks it. Centralized here rather than at
// every navigation call site.
let pinShownFor = null;

function render() {
  const app = document.getElementById('app');
  for (const id of [...ui.selected]) if (!getItem(id)) ui.selected.delete(id);
  if (!(ui.view === 'detail' && ui.itemId === pinShownFor)) { ui.pinShown = false; pinShownFor = null; }
  if (ui.view === 'detail' && getItem(ui.itemId)) app.innerHTML = renderDetail(getItem(ui.itemId));
  else { ui.view = 'list'; app.innerHTML = renderList(); }
  // header checkbox tri-state has to be set after paint — no HTML attribute for indeterminate
  const sa = document.getElementById('sel-all');
  if (sa) {
    const vis = visibleItems();
    const selVis = vis.filter(i => ui.selected.has(i.id)).length;
    sa.checked = vis.length > 0 && selVis === vis.length;
    sa.indeterminate = selVis > 0 && selVis < vis.length;
  }
}

// ═════════════════════════════════════════════════════════════════
// SELECTION — batch actions on the visible list
// ═════════════════════════════════════════════════════════════════
function toggleSel(id, on) {
  on ? ui.selected.add(id) : ui.selected.delete(id);
  render();
}

function toggleSelAll(on) {
  for (const it of visibleItems()) on ? ui.selected.add(it.id) : ui.selected.delete(it.id);
  render();
}

function clearSel() { ui.selected.clear(); render(); }

// Bulk status change. The <select> is a menu, not a bound field — it
// resets to its placeholder so the same status can be applied twice.
function setSelectedStatus(status) {
  const sel = document.getElementById('sel-status');
  if (sel) sel.value = '';
  if (!status || !STATUSES[status]) return;
  const items = [...ui.selected].map(getItem).filter(Boolean);
  if (!items.length) return;
  const changed = items.filter(it => it.status !== status);
  if (!changed.length) { toast('All selected items are already ' + STATUSES[status] + '.'); return; }
  for (const it of changed) { it.status = status; touch(it); }
  save();
  toast(changed.length + ' item' + (changed.length > 1 ? 's' : '') + ' set to ' + STATUSES[status] + '.');
  render();
}

function delSelected() {
  const n = ui.selected.size;
  if (!n) return;
  if (!confirm('Delete ' + n + ' selected item' + (n > 1 ? 's' : '') + '? This cannot be undone.')) return;
  data.items = data.items.filter(i => !ui.selected.has(i.id));
  ui.selected.clear();
  save();
  toast(n + ' item' + (n > 1 ? 's' : '') + ' deleted.');
  render();
}

function visibleItems() {
  let items = data.items.filter(it =>
    (ui.cat === 'all' || it.category === ui.cat) &&
    (ui.status === 'all' || it.status === ui.status));
  const q = ui.search.trim().toLowerCase();
  if (q) {
    items = items.filter(it =>
      [it.serial, it.assetTag, it.user, it.model, it.location, it.technician, it.notes]
        .some(v => (v || '').toLowerCase().includes(q)) ||
      it.customFields.some(f => (f.label || '').toLowerCase().includes(q) || (f.value || '').toLowerCase().includes(q)));
  }
  return sortItems(items);
}

function sortItems(items) {
  const k = ui.sortKey, dir = ui.sortDir;
  const val = it => {
    switch (k) {
      case 'item': return itemLabel(it).toLowerCase();
      case 'user': return (it.user || '').toLowerCase();
      case 'cat': return CATEGORIES[it.category] || '';
      case 'status': return Object.keys(STATUSES).indexOf(it.status);
      case 'prog': return it.dep ? it.dep.progress.pct : -1;
      default: return it.updatedAt || it.addedAt || '';
    }
  };
  return [...items].sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
}

function setSort(k) {
  if (ui.sortKey === k) ui.sortDir *= -1;
  else { ui.sortKey = k; ui.sortDir = k === 'updated' || k === 'prog' ? -1 : 1; }
  render();
}

function renderList() {
  const all = data.items;
  if (!all.length) {
    return `<div class="empty">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <h2>No items tracked yet</h2>
      <p>This tracker is populated by import only — paste or upload Deployment Checklist<br>exports and asset JSON files. Dragging .json files onto the page works too.</p>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="openImport()">&#8657; Import JSON</button>
      </div>
    </div>`;
  }

  const counts = { total: all.length, setup: 0, deployed: 0, attention: 0 };
  for (const it of all) {
    if (it.status === 'in-setup') counts.setup++;
    if (it.status === 'deployed') counts.deployed++;
    if (it.status === 'repair') counts.attention++;
  }

  const items = visibleItems();

  const cats = [...new Set(all.map(i => i.category))];
  const arrow = k => ui.sortKey === k ? `<span class="dir">${ui.sortDir === 1 ? '▲' : '▼'}</span>` : '';

  const rows = items.map(it => {
    const dep = it.dep;
    return `<tr onclick="ui.view='detail';ui.itemId='${it.id}';render()">
      <td class="sel-col" onclick="event.stopPropagation()">
        <input type="checkbox"${ui.selected.has(it.id) ? ' checked' : ''} onchange="toggleSel('${it.id}',this.checked)"></td>
      <td><div class="serial">${esc(itemLabel(it))}${(it.documents || []).some(d => safeUrl(d.url))
          ? ` <span style="font-size:12px" title="${esc(it.documents.filter(d => safeUrl(d.url)).map(d => d.label || d.url).join(', '))}">&#128206;</span>` : ''}</div>${it.assetTag && it.serial ? `<div class="sub">${esc(it.serial)}</div>` : ''}</td>
      <td>${esc(it.user) || '<span class="sub">—</span>'}${it.model ? `<div class="sub">${esc(it.model)}</div>` : ''}</td>
      <td><span class="cat-chip">${esc(CATEGORIES[it.category] || it.category)}</span></td>
      <td><span class="pill pill-${esc(it.status)}">${esc(STATUSES[it.status] || it.status)}</span></td>
      <td style="min-width:95px">${dep
        ? `<div class="prog${dep.progress.pct === 100 ? ' full' : ''}"><div style="width:${dep.progress.pct}%"></div></div><div class="prog-txt">${dep.progress.pct}%${dep.date ? ' · ' + esc(fmtDate(dep.date)) : ''}</div>`
        : '<span class="sub">—</span>'}</td>
      <td class="sub" style="white-space:nowrap">${fmtDate(it.updatedAt || it.addedAt)}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="7"><div class="empty" style="padding:36px 16px">No items match the current filters.</div></td></tr>`;

  const selBar = ui.selected.size ? `<div class="selbar">
      <b>${ui.selected.size} selected</b><span class="spacer"></span>
      <select id="sel-status" onchange="setSelectedStatus(this.value)" title="Set the status of every selected item">
        <option value="">Set Status&mldr;</option>
        ${Object.entries(STATUSES).map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}
      </select>
      <button class="btn btn-sm btn-ghost" onclick="clearSel()">Clear</button>
      <button class="btn btn-sm btn-danger" onclick="delSelected()">Delete Selected</button>
    </div>` : '';

  return `
    <div class="tiles">
      <div class="tile"><div class="tile-label">Total Items</div><div class="tile-value">${counts.total}</div></div>
      <div class="tile"><div class="tile-label">In Setup</div><div class="tile-value" style="color:var(--teal-dk)">${counts.setup}</div></div>
      <div class="tile"><div class="tile-label">Deployed</div><div class="tile-value" style="color:var(--green)">${counts.deployed}</div></div>
      <div class="tile"><div class="tile-label">In Repair</div><div class="tile-value" style="color:${counts.attention ? 'var(--amber)' : 'var(--navy)'}">${counts.attention}</div></div>
    </div>
    <div class="toolbar">
      <input type="search" placeholder="Search serial, asset tag, user, model, custom fields…" value="${esc(ui.search)}" oninput="ui.search=this.value;render()">
      ${cats.length > 1 || ui.cat !== 'all' ? `<select onchange="ui.cat=this.value;render()">
        <option value="all">All Categories</option>
        ${Object.keys(CATEGORIES).filter(c => cats.includes(c)).map(c => `<option value="${c}"${ui.cat === c ? ' selected' : ''}>${esc(CATEGORIES[c])}</option>`).join('')}
      </select>` : ''}
      <select onchange="ui.status=this.value;render()">
        <option value="all">All Statuses</option>
        ${Object.entries(STATUSES).map(([v, l]) => `<option value="${v}"${ui.status === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}
      </select>
      <button class="btn btn-primary" onclick="openImport()" title="Import Deployment Checklist exports or asset JSON — paste or choose files (multi-select supported)">&#8657; Import</button>
    </div>
    ${selBar}
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th class="sel-col"><input type="checkbox" id="sel-all" onchange="toggleSelAll(this.checked)" title="Select all visible"></th>
        <th onclick="setSort('item')">Item${arrow('item')}</th>
        <th onclick="setSort('user')">User / Model${arrow('user')}</th>
        <th onclick="setSort('cat')">Category${arrow('cat')}</th>
        <th onclick="setSort('status')">Status${arrow('status')}</th>
        <th onclick="setSort('prog')">Deployment${arrow('prog')}</th>
        <th onclick="setSort('updated')">Updated${arrow('updated')}</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

// ═════════════════════════════════════════════════════════════════
// RENDER — DETAIL
// ═════════════════════════════════════════════════════════════════
function renderDetail(it) {
  const mf = (label, field, ph) => `<div class="mf"><label>${label}</label>
    <input value="${esc(it[field])}" placeholder="${ph || ''}" onblur="setField('${it.id}','${field}',this.value)"></div>`;

  const meta = `<div class="card"><div class="meta-grid">
    ${mf('Serial Number', 'serial')}
    ${mf('Asset Tag', 'assetTag')}
    ${mf('Model', 'model')}
    ${mf('Assigned User / Owner', 'user')}
    ${mf('Location', 'location')}
    ${mf('Technician', 'technician')}
    <div class="mf"><label>Category</label>
      <select onchange="setField('${it.id}','category',this.value)">
        ${Object.entries(CATEGORIES).map(([v, l]) => `<option value="${v}"${it.category === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}
      </select></div>
    <div class="mf"><label>Status</label>
      <select onchange="setField('${it.id}','status',this.value)">
        ${Object.entries(STATUSES).map(([v, l]) => `<option value="${v}"${it.status === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}
      </select></div>
    <div class="mf"><label>Added</label><input value="${fmtDate(it.addedAt)}" disabled style="opacity:.6"></div>
    <div class="mf mf-wide"><label>Notes</label>
      <textarea onblur="setField('${it.id}','notes',this.value)" placeholder="Anything worth noting about this item…">${esc(it.notes)}</textarea></div>
    <div class="mf mf-wide"><label>Custom Fields</label>
      ${it.customFields.map(f => `<div class="cf-row">
        <input class="cf-label" value="${esc(f.label)}" placeholder="Field (e.g. IMEI, IP Address)" onblur="setCF('${it.id}','${f.id}','label',this.value)">
        <input class="cf-value" value="${esc(f.value)}" placeholder="Value" onblur="setCF('${it.id}','${f.id}','value',this.value)">
        <button class="btn btn-sm btn-ghost" onclick="delCF('${it.id}','${f.id}')" title="Remove">&#10005;</button>
      </div>`).join('')}
      <div><button class="btn btn-sm btn-ghost" onclick="addCF('${it.id}')">&#43; Add Field</button></div>
    </div>
  </div></div>`;

  const pinCard = `<div class="card pin-card">
    <div class="sec-hdr"><h2>Device Access</h2>
      ${it.pin ? `<button class="btn btn-sm btn-ghost" onclick="clearPin('${it.id}')" title="Remove the stored PIN">Clear PIN</button>` : ''}</div>
    <div class="sub" style="margin:-6px 0 12px">The local sign-in PIN set on this machine during setup.
      Stored in this browser only${PIN_EXPORT.print ? ' and shown on the printed sheet' : ''} —
      ${PIN_EXPORT.csv ? 'included in' : 'left out of'} CSV exports and
      ${PIN_EXPORT.backup ? 'included in' : 'left out of'} JSON backups.</div>
    <div class="pin-row">
      <input id="pin-input" class="pin-input" type="${ui.pinShown ? 'text' : 'password'}"
        value="${esc(it.pin)}" placeholder="e.g. 4-8 digits" autocomplete="off"
        spellcheck="false" inputmode="numeric"
        onblur="setPin('${it.id}',this.value)">
      <button id="pin-eye" class="btn btn-sm btn-secondary" onclick="togglePin('${it.id}')"
        title="${ui.pinShown ? 'Hide the PIN' : 'Reveal the PIN'}">${ui.pinShown ? 'Hide' : 'Show'}</button>
    </div>
    ${PIN_EXPORT.print ? `<div class="pin-print"><span class="pin-print-label">PIN:</span> ${esc(it.pin || '—')}</div>` : ''}
  </div>`;

  const docsCard = `<div class="card">
    <div class="sec-hdr"><h2>Documents</h2></div>
    <div class="sub" style="margin:-6px 0 12px">Link scanned handoff paperwork — e.g. the signed deployment checklist — once the device is assigned.</div>
    ${it.documents.map(d => { const url = safeUrl(d.url); return `<div class="cf-row">
      <input class="cf-label" value="${esc(d.label)}" placeholder="e.g. Signed checklist" onblur="setDoc('${it.id}','${d.id}','label',this.value)">
      <input class="cf-value" value="${esc(d.url)}" placeholder="Paste SharePoint / OneDrive link…" onblur="setDoc('${it.id}','${d.id}','url',this.value)">
      ${url
        ? `<a class="btn btn-sm btn-secondary" href="${esc(url)}" target="_blank" rel="noopener" title="Open document">&#8599;</a>`
        : `<span class="btn btn-sm btn-ghost" style="opacity:.4;cursor:default" title="Enter a link to open">&#8599;</span>`}
      <button class="btn btn-sm btn-ghost" onclick="delDoc('${it.id}','${d.id}')" title="Remove">&#10005;</button>
    </div>`; }).join('') || '<div class="sub" style="margin-bottom:10px">No documents linked yet.</div>'}
    <div><button class="btn btn-sm btn-ghost" onclick="addDoc('${it.id}')">&#43; Add Document Link</button></div>
  </div>`;

  return `
    <div class="detail-top">
      <button class="btn btn-ghost" onclick="ui.view='list';render()">&#8592; All Items</button>
      <div class="detail-title">${esc(itemLabel(it))}
        <span class="cat-chip">${esc(CATEGORIES[it.category] || it.category)}</span>
        <span class="pill pill-${esc(it.status)}">${esc(STATUSES[it.status] || it.status)}</span>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="printItem('${it.id}')">Print</button>
      <button class="btn btn-danger btn-sm" onclick="delItem('${it.id}')">Delete</button>
    </div>
    ${meta}
    ${pinCard}
    ${docsCard}
    ${it.dep ? renderDeployment(it) : `<div class="card" style="color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <span>No deployment record attached. Import this item's checklist JSON and it will match on serial <b>${esc(it.serial || '—')}</b>.</span>
      <button class="btn btn-secondary btn-sm" onclick="openImport()">&#8657; Import</button>
    </div>`}`;
}

function renderDeployment(it) {
  const d = it.dep, pr = d.progress;

  const phaseHtml = d.phases.map(p => {
    const badge = (p.skipped ? '<span class="badge badge-skip">Skipped</span>'
      : p.complete ? '<span class="badge badge-done">&#10003; Complete</span>'
      : '<span class="badge badge-partial">Partial</span>')
      + (p.excluded && !p.skipped ? ' <span class="badge badge-skip" title="Handoff phase — completed with the user present; not counted in the deployment %">Not in %</span>' : '');
    const doneCt = p.steps.filter(s => s.checked).length;
    let body;
    if (p.skipped) {
      body = `<div class="skipnote">${esc(p.skipNote)}</div>`;
    } else {
      let lastSec = null;
      body = p.steps.map(s => {
        const secLbl = s.section && s.section !== lastSec ? `<span class="sec">${esc(s.section)}</span>` : '';
        lastSec = s.section || lastSec;
        return `<div class="dstep${s.skipped ? ' skip' : ''}">
          <span class="mk ${s.checked ? 'y' : 'n'}">${s.skipped ? '—' : s.checked ? '✓' : '○'}</span>
          <span>${secLbl}${esc(s.text)}${s.optional ? ' <span class="sub">(if applicable)</span>' : ''}</span>
        </div>`;
      }).join('');
    }
    return `<details class="phase"${!p.skipped && !p.complete ? ' open' : ''}>
      <summary><span class="chev">&#9654;</span><span class="ph-num">${p.number}</span>${esc(p.title)}${badge}
        <span class="ct">${p.skipped ? '' : doneCt + '/' + p.steps.length}</span></summary>
      ${body}
    </details>`;
  }).join('');

  const listHtml = (title, arr) => arr.length ? `<details class="phase">
    <summary><span class="chev">&#9654;</span>${title}
      <span class="ct">${arr.filter(x => !x.skipped && x.checked).length}/${arr.filter(x => !x.skipped).length}</span></summary>
    ${arr.map(x => `<div class="dstep${x.skipped ? ' skip' : ''}">
      <span class="mk ${x.checked ? 'y' : 'n'}">${x.skipped ? '—' : x.checked ? '✓' : '○'}</span><span>${esc(x.text)}${x.excluded && !x.skipped ? ' <span class="badge badge-skip" title="Handoff item — verified with the user present; not counted in the deployment %">Not in %</span>' : ''}</span>
    </div>`).join('')}
  </details>` : '';

  return `<div class="card">
    <div class="sec-hdr"><h2>Deployment Record${d.sop ? ' · ' + esc(d.sop) : ''}</h2>
      <button class="btn btn-sm btn-ghost" onclick="detachDep('${it.id}')" title="Remove imported record">Detach</button></div>
    <div class="dep-summary">
      <span><b>${esc(d.deviceTypeLabel)}</b>${d.trainingPC ? ' · Training PC' : ''}</span>
      ${d.technician ? `<span>Tech: <b>${esc(d.technician)}</b></span>` : ''}
      ${d.date ? `<span>Date: <b>${esc(fmtDate(d.date))}</b></span>` : ''}
      <span>Phases: <b>${pr.phasesComplete}/${pr.phases}</b></span>
      <span>Steps: <b>${pr.stepsChecked}/${pr.steps}</b></span>
      <div class="dep-bar">
        <div class="prog${pr.pct === 100 ? ' full' : ''}" style="flex:1"><div style="width:${pr.pct}%"></div></div>
        <b style="font-size:13px">${pr.pct}%</b>
      </div>
    </div>
    ${d.physCondition ? `<div class="dep-summary"><span>Physical condition: <b>${esc(d.physCondition)}</b></span></div>` : ''}
    ${listHtml('Prerequisites', d.prereqs)}
    ${phaseHtml}
    ${listHtml('Final Checklist', d.final)}
    ${d.notes ? `<div style="margin-top:12px;font-size:13px;color:var(--muted);white-space:pre-wrap"><b style="color:var(--text)">Checklist notes:</b> ${esc(d.notes)}</div>` : ''}
    <div class="sub" style="margin-top:10px">Imported ${fmtDate(d.importedAt)} — read-only snapshot from the Deployment Checklist tool.</div>
  </div>`;
}

// ═════════════════════════════════════════════════════════════════
// DRAG & DROP IMPORT + INIT
// ═════════════════════════════════════════════════════════════════
let dragDepth = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) document.getElementById('drop').classList.add('on'); });
document.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; document.getElementById('drop').classList.remove('on'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  document.getElementById('drop').classList.remove('on');
  if (e.dataTransfer && e.dataTransfer.files.length) handleImportFiles(e.dataTransfer.files);
});

render();
</script>
</body>
</html>
